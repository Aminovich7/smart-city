{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="split-header">
        <h2>User Management</h2>
        <a href="{% url 'users:user_create' %}" class="btn">Create User</a>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone }}</td>
                    <td class="inline-actions">
                        <a href="{% url 'users:user_update' user.pk %}" class="btn">Edit</a>
                        <a href="{% url 'users:user_delete' user.pk %}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
