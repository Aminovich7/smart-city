{% extends 'base.html' %}
{% block content %}
<div class="form-card card">
    <h2>Register as Citizen</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
            <small class="form-error">{{ field.errors }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Register</button>
    </form>
    <p class="text-muted center-text">
        Already have an account? <a href="{% url 'users:login' %}" class="text-link">Login</a>
    </p>
</div>
{% endblock %}
