{% extends 'base.html' %}
{% block content %}
<div class="form-card card">
    <h2>Delete User</h2>
    <p class="text-muted">Are you sure you want to delete user "<strong>{{ object.username }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <div class="inline-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'users:user_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
