{% extends 'base.html' %}
{% block content %}
<div class="form-card card">
    <h2>{% if form.instance.pk %}Edit{% else %}Create{% endif %} User</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}<small class="form-error">{{ field.errors }}</small>{% endif %}
        </div>
        {% endfor %}
        <div class="inline-actions">
            <button type="submit" class="btn">Save</button>
            <a href="{% url 'users:user_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
