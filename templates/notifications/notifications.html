{% extends 'base.html' %}
{% block content %}
<h2>Notifications</h2>
<ul>
    {% for notification in notifications %}
    <li class="{% if not notification.is_read %}unread{% endif %}">
        <strong>{{ notification.get_notification_type_display }}</strong>: {{ notification.message }}<br>
        <small>{{ notification.created_at }}</small>
    </li>
    {% empty %}
    <li>No notifications.</li>
    {% endfor %}
</ul>
{% endblock %}
