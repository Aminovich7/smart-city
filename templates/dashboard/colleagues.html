<!DOCTYPE html>
<html>
<head>
    <title>Hamkasblar</title>
</head>
<body>

    <h3>Bo'lim: {{ department }}</h3>

    <table border="1">
        <thead>
            <tr>
                <th>Rasm</th>
                <th>Username</th>
                <th>Telefon</th>
                <th>Vazifalar soni</th>
            </tr>
        </thead>
        <tbody>
            {% for colleague in colleagues %}
            <tr>
                <td>
                    <img src="{{ colleague.avatar.url }}" width="40">
                </td>
                <td>{{ colleague.username }}</td>
                <td>{{ colleague.phone }}</td>
                <td>{{ colleague.assigned_incidents_count }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Hech kim topilmadi.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p>
        <a href="{% url 'operator_dashboard' %}">Orqaga qaytish</a>
    </p>

</body>
</html>
